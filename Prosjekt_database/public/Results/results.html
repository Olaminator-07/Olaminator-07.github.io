<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="results.js" defer></script>
    <link rel="stylesheet" href="results.css">

</head>
    <body>
        <a href="/">Hjem</a>

    <div id="sidebar">
        <h1>Se tidligere resultater</h1>
        <select id="personDropdown" title="Personvalg">  <!-- Dropdown der en velger personen man vil se resultatene til-->
            <option value="">Velg en person</option>
        </select>
    </div>

    <div id="resultatContainer">Her kommer resultatene til den valgte føreren:</div> <!-- Fylles ut i JS, liste med resultater-->

    <form id="nytt_resultat_form">
        <h1>Registrer nye resultater:</h1>
        
        <!-- Dropdown for å velge navn: -->
        <label for="navn-dropdown">Navn:</label>
        <select id="navn-dropdown" name="navn-dropdown" required>
            <!-- Fylles ut av JS -->
        </select>
        
        <!-- Dropdown for å velge løp: -->
        <label for="løp-dropdown">Løp:</label>
        <select id="løp-dropdown" name="løp-dropdown" required>
            <!-- Fylles ut av JS -->
        </select>

        <!-- Bil -->
        <label for="bil">Bil:</label>
        <select name="bil" id="bil" required>
        </select>

        <!-- Plassering-->
         <label for="plassering">Plassering:</label>
         <input type="number" name="plassering" id="plassering" required>

         <!-- Poeng -->
        <label for="poeng">Antall poeng gitt (NC):</label>
        <input type="number" name="poeng" id="poeng" required>

        <button type="submit">Registrer nytt resultat</button>
    </form>
    
    </body>
</html>
