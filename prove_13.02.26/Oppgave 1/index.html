<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <script src="script.js" defer></script>

</head>
    <body>
        <h1>Registrering til arrangement</h1>
        <form id="skjema">
            <label for="fname">Fornavn:</label>
            <input type="text" name="fname" id="fname" placeholder="Skriv fornavnet ditt her:" required>

            <label for="lname">Etternavn:</label>
            <input type="text" name="lname" id="lname" placeholder="Skriv etternavn her" required>

            <label for="epost">Epost:</label>
            <input type="email" name="epost" id="epost" placeholder="Skriv epost her" required>

            <label for="passord">Passord:</label>
            <input type="password" name="passord" id="passord" placeholder="Skriv passord her" required>

            <label for="rabattkode">Rabattkode</label>
            <input type="text" name="rabattkode" id="rabattkode" placeholder="Skriv eventuell rabatt kode">

            <button type="submit">Send inn</button>
        </form>

        <div id="tekst">

        </div>
    
    </body>
</html>
